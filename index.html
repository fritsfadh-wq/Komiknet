
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Komiknet</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#11111b;color:white;font-family:Arial,sans-serif}
header{background:#191927;padding:18px;text-align:center;font-size:25px;font-weight:bold;color:#b68cff}
nav{display:flex;gap:18px;overflow-x:auto;padding:14px;background:#222235;white-space:nowrap}
nav a{color:white;text-decoration:none}
main{padding:18px}
.banner{background:linear-gradient(120deg,#6326a8,#24134c);padding:30px 20px;border-radius:15px;margin-bottom:25px}
.banner h1{margin:0 0 10px}
input{width:100%;padding:13px;border-radius:10px;border:0;margin-bottom:20px;font-size:16px}
h2{font-size:21px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.card{background:#222235;border-radius:12px;overflow:hidden;cursor:pointer}
.cover{height:155px;display:flex;align-items:center;justify-content:center;font-size:55px;background:linear-gradient(145deg,#542d85,#17172c)}
.card-info{padding:12px}
.card h3{font-size:15px;margin:0 0 7px}
.card p{font-size:12px;color:#bbb;margin:0}
button{background:#9b62ed;color:white;border:0;padding:12px 18px;border-radius:9px;cursor:pointer}
#detail,#reader{display:none}
.episode{background:#222235;padding:15px;border-radius:10px;margin:12px 0;cursor:pointer}
.panel{background:#29283b;margin:12px 0;padding:55px 15px;text-align:center;border-radius:8px;color:#ccc}
#reader img{width:100%;display:block}
footer{text-align:center;color:#999;padding:25px;font-size:13px}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>

<header>KOMIKNET</header>

<nav>
<a href="#" onclick="beranda()">Beranda</a>
<a href="#" onclick="kategori('Action')">Action</a>
<a href="#" onclick="kategori('Fantasy')">Fantasy</a>
<a href="#" onclick="kategori('Romance')">Romance</a>
<a href="#" onclick="kategori('Comedy')">Comedy</a>
</nav>

<main id="home">
<div class="banner">
<h1>Dunia Komik Tanpa Batas!</h1>
<p>Baca komik favoritmu kapan saja dan di mana saja.</p>
</div>

<input id="search" placeholder="Cari judul komik..." oninput="cariKomik()">

<h2 id="judul">Komik Terbaru</h2>
<div class="grid" id="daftar"></div>
</main>

<main id="detail">
<button onclick="beranda()">← Kembali</button>
<h1 id="namaDetail"></h1>
<p id="deskripsi"></p>
<h2>Daftar Episode</h2>
<div class="episode" onclick="baca()">Episode 1 — Awal Petualangan</div>
</main>

<main id="reader">
<button onclick="kembaliDetail()">← Kembali</button>
<h2 id="judulBaca"></h2>
<p>Episode 1</p>
<div class="panel">Halaman Komik 1</div>
<div class="panel">Halaman Komik 2</div>
<div class="panel">Halaman Komik 3</div>
<button onclick="kembaliDetail()">Kembali ke Daftar Episode</button>
</main>

<footer>© 2026 Komiknet</footer>

<script>
const komik=[
{nama:"Petualangan Ksatria",kategori:"Fantasy",emoji:"⚔️",deskripsi:"Kisah seorang ksatria muda dalam petualangan besar."},
{nama:"Dunia Naga",kategori:"Adventure",emoji:"🐉",deskripsi:"Petualangan seru di dunia para naga."},
{nama:"Raja Sihir",kategori:"Action",emoji:"✨",deskripsi:"Perjalanan seorang pemuda menuju kekuatan sihir tertinggi."},
{nama:"Kisah Sekolah",kategori:"Romance",emoji:"🌸",deskripsi:"Cerita kehidupan dan persahabatan di sekolah."}
];

let pilihan=0;

function tampilkan(data){
const daftar=document.getElementById("daftar");
daftar.innerHTML="";
data.forEach(item=>{
const index=komik.indexOf(item);
daftar.innerHTML+=`
<div class="card" onclick="buka(${index})">
<div class="cover">${item.emoji}</div>
<div class="card-info">
<h3>${item.nama}</h3>
<p>${item.kategori} • Episode 1</p>
</div>
</div>`;
});
}

function buka(index){
pilihan=index;
document.getElementById("home").style.display="none";
document.getElementById("reader").style.display="none";
document.getElementById("detail").style.display="block";
document.getElementById("namaDetail").textContent=komik[index].nama;
document.getElementById("deskripsi").textContent=komik[index].deskripsi;
}

function beranda(){
document.getElementById("home").style.display="block";
document.getElementById("detail").style.display="none";
document.getElementById("reader").style.display="none";
document.getElementById("search").value="";
document.getElementById("judul").textContent="Komik Terbaru";
tampilkan(komik);
}

function baca(){
document.getElementById("detail").style.display="none";
document.getElementById("reader").style.display="block";
document.getElementById("judulBaca").textContent=komik[pilihan].nama;
}

function kembaliDetail(){
document.getElementById("reader").style.display="none";
document.getElementById("detail").style.display="block";
}

function cariKomik(){
const kata=document.getElementById("search").value.toLowerCase();
tampilkan(komik.filter(item=>item.nama.toLowerCase().includes(kata)));
}

function kategori(nama){
document.getElementById("home").style.display="block";
document.getElementById("detail").style.display="none";
document.getElementById("reader").style.display="none";
document.getElementById("judul").textContent="Kategori "+nama;
document.getElementById("search").value="";
tampilkan(komik.filter(item=>item.kategori===nama));
}

tampilkan(komik);
</script>
</body>
</html>
