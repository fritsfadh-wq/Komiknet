
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Komiknet - Baca Komik Indonesia</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f5f9;
      color: #222;
    }
    header {
      background: #25234a;
      color: white;
      padding: 20px;
    }
    header h1 { margin: 0; }
    header p { margin-bottom: 0; }
    .search {
      padding: 15px;
    }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }
    main { padding: 15px; }
    h2 { font-size: 20px; }
    .comics {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }
    .comic {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px #0001;
    }
    .cover {
      height: 160px;
      display: grid;
      place-items: center;
      background: #deddf5;
      font-size: 55px;
    }
    .comic h3 {
      font-size: 15px;
      margin: 10px;
    }
    .comic p {
      font-size: 12px;
      margin: 0 10px 12px;
      color: #777;
    }
  </style>
</head>
<body>
  <header>
    <h1>Komiknet</h1>
    <p>Baca Komik Favoritmu di Sini!</p>
  </header>

  <div class="search">
    <input type="text" id="search"
      placeholder="Cari komik..."
      oninput="cariKomik()">
  </div>

  <main>
    <h2>Komik Terbaru</h2>
    <div class="comics" id="comics">
      <div class="comic">
        <div class="cover">⚔️</div>
        <h3>Petualangan Ksatria</h3>
        <p>Fantasy • Episode 1</p>
      </div>
      <div class="comic">
        <div class="cover">🐉</div>
        <h3>Dunia Naga</h3>
        <p>Adventure • Episode 1</p>
      </div>
      <div class="comic">
        <div class="cover">✨</div>
        <h3>Raja Sihir</h3>
        <p>Action • Episode 1</p>
      </div>
      <div class="comic">
        <div class="cover">🌸</div>
        <h3>Kisah Sekolah</h3>
        <p>Romance • Episode 1</p>
      </div>
    </div>
  </main>

  <script>
    function cariKomik() {
      const kata = document.getElementById("search")
        .value.toLowerCase();
      document.querySelectorAll(".comic").forEach(item => {
        item.style.display =
          item.innerText.toLowerCase().includes(kata)
          ? "block" : "none";
      });
    }
  </script>
</body>
</html>
